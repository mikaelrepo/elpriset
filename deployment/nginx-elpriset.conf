# Nginx configuration for Elpriser Sverige PWA
# Place this file at: /etc/nginx/sites-available/elpriset
# Then enable with: sudo ln -s /etc/nginx/sites-available/elpriset /etc/nginx/sites-enabled/
# Test with: sudo nginx -t
# Reload with: sudo systemctl reload nginx

# HTTP server block - redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name elpriset.example.com www.elpriset.example.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;

    # Alternative: serve directly on HTTP (for development)
    # Uncomment the block below and comment out the return statement above
    # root /var/www/elpriset;
    # index index.html;
    # include /etc/nginx/snippets/elpriset-common.conf;
}

# HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name elpriset.example.com www.elpriset.example.com;

    # SSL certificates (generated with Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/elpriset.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elpriset.example.com/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Root directory
    root /var/www/elpriset;
    index index.html;

    # Logging
    access_log /var/log/nginx/elpriset_access.log combined;
    error_log /var/log/nginx/elpriset_error.log warn;

    # ============================================
    # CACHING STRATEGY
    # ============================================

    # Cache static assets for 30 days
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header ETag "";
        if_modified_since off;
        access_log off;
    }

    # Service Worker - never cache
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header ETag "";
        if_modified_since off;
    }

    # HTML files - never cache
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header ETag "";
        if_modified_since off;
    }

    # Manifest and JSON files - no cache
    location ~* \.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Type "application/json";
        add_header ETag "";
        if_modified_since off;
    }

    # ============================================
    # COMPRESSION
    # ============================================

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # ============================================
    # SECURITY HEADERS
    # ============================================

    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Enable XSS protection
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer policy
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Content Security Policy (adjust as needed)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://www.elprisetjustnu.se https://api.allorigins.win https://corsproxy.io; frame-ancestors 'none';" always;

    # Permissions policy
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # ============================================
    # CORS HEADERS
    # ============================================

    # Allow CORS for API calls (adjust origin as needed)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;

    # Handle OPTIONS requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # ============================================
    # SPA ROUTING
    # ============================================

    # Try to serve the requested file, directory, or fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================
    # DENY ACCESS TO SENSITIVE FILES
    # ============================================

    # Deny access to hidden files and directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to backup files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # PERFORMANCE OPTIMIZATION
    # ============================================

    # Enable sendfile for efficient file serving
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Timeouts
    keepalive_timeout 65;
    client_max_body_size 10M;

    # ============================================
    # ERROR PAGES
    # ============================================

    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}

